[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxmesh"
version = "0.1.0"
description = "Distributed job orchestration platform with intelligent scheduling, retries, priorities, worker coordination, and fault-tolerant execution."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vimal Sahani", email = "vimalsahani2005@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "redis>=5.0.0",
    "fakeredis>=2.20.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.scripts]
fluxmesh = "fluxmesh.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
